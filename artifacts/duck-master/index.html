<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO -->
    <title>GDY — Go Duck Yourself | 842 Cybersecurity, OSINT &amp; AI Tools</title>
    <meta name="description" content="GDY (Go Duck Yourself) is a curated directory of 842 cybersecurity, OSINT, and AI tools across 25 specialist modules. Browse threat intelligence, network scanning, blockchain OSINT, AI agents, and more." />
    <meta name="keywords" content="GDY, Go Duck Yourself, OSINT tools, cybersecurity tools, threat intelligence, network scanning, GEOINT, blockchain OSINT, AI tools, digital forensics, reverse engineering" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="GDY" />

    <!-- Canonical -->
    <link rel="canonical" href="https://gdy.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GDY — Go Duck Yourself" />
    <meta property="og:title" content="GDY — Go Duck Yourself | 842 Cybersecurity, OSINT &amp; AI Tools" />
    <meta property="og:description" content="842 curated cybersecurity, OSINT, and AI tools across 25 specialist modules. Browse, search, and discover the right tool for your research." />
    <meta property="og:url" content="https://gdy.com/" />
    <meta property="og:image" content="https://gdy.com/gdy-hero.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GDY — Go Duck Yourself | Cybersecurity &amp; OSINT Tools" />
    <meta name="twitter:description" content="842 curated cybersecurity, OSINT, and AI tools across 25 specialist modules. Free to browse." />
    <meta name="twitter:image" content="https://gdy.com/gdy-hero.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/gdy-badge.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "GDY — Go Duck Yourself",
      "alternateName": "GDY",
      "url": "https://gdy.com/",
      "description": "A curated directory of 842 cybersecurity, OSINT, and AI tools across 25 specialist modules.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://gdy.com/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "GDY",
      "alternateName": "Go Duck Yourself",
      "url": "https://gdy.com/",
      "logo": "https://gdy.com/gdy-logo.png",
      "description": "Educational cybersecurity, OSINT, and AI tool directory."
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
