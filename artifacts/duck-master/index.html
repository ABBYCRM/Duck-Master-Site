<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO -->
    <title>Duck Master — Cybersecurity, OSINT &amp; AI Tool Directory</title>
    <meta name="description" content="Duck Master is a curated directory of 842 cybersecurity, OSINT, and AI tools across 25 specialist modules. Browse threat intelligence, network scanning, blockchain OSINT, AI agent frameworks, and more." />
    <meta name="keywords" content="OSINT tools, cybersecurity tools, threat intelligence, network scanning, GEOINT, blockchain OSINT, AI tools, digital forensics, reverse engineering" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Duck Master" />

    <!-- Canonical -->
    <link rel="canonical" href="https://duck-master.replit.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Duck Master" />
    <meta property="og:title" content="Duck Master — Cybersecurity, OSINT &amp; AI Tool Directory" />
    <meta property="og:description" content="A curated directory of 842 cybersecurity, OSINT, and AI tools across 25 specialist modules. Browse, search, and discover the right tool for your research." />
    <meta property="og:url" content="https://duck-master.replit.app/" />
    <meta property="og:image" content="https://duck-master.replit.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Duck Master — Cybersecurity, OSINT &amp; AI Tool Directory" />
    <meta name="twitter:description" content="842 curated cybersecurity, OSINT, and AI tools across 25 specialist modules. Free to browse." />
    <meta name="twitter:image" content="https://duck-master.replit.app/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Duck Master",
      "url": "https://duck-master.replit.app/",
      "description": "A curated directory of 842 cybersecurity, OSINT, and AI tools across 25 specialist modules.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://duck-master.replit.app/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Duck Master",
      "url": "https://duck-master.replit.app/",
      "description": "Educational cybersecurity, OSINT, and AI tool directory.",
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
